# OpenLLM-Eval — Docker Compose deployment.
#
#   cp .env.example .env   # then set POSTGRES_PASSWORD
#   bash scripts/deploy.sh # = docker compose up -d --build + upgrade handling + smoke test
#
# Model servers (vLLM, Ollama, ...) are NOT part of this project; point endpoints at them by URL.
# For a development setup with hot reload, add -f docker-compose.dev.yml.

# Fixed project name: unpacking a new release into a differently named folder upgrades the same
# stack (same containers and volumes) instead of starting a second copy that fights over ports.
name: openllm-eval

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  # Discrete settings (not a hand-built URL): the backend escapes them, so the password may
  # contain any characters.
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-openllm}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-openllm_eval}
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  # Model endpoint network policy (see .env.example and SECURITY.md).
  ENDPOINT_ALLOW_PRIVATE_NETWORKS: ${ENDPOINT_ALLOW_PRIVATE_NETWORKS:-false}
  ENDPOINT_ALLOWED_HOSTS: ${ENDPOINT_ALLOWED_HOSTS:-}
  ENDPOINT_BLOCKED_HOSTS: ${ENDPOINT_BLOCKED_HOSTS:-postgres,redis}
  ENDPOINT_MAX_RESPONSE_BYTES: ${ENDPOINT_MAX_RESPONSE_BYTES:-16777216}
  # Empty = custom CA paths disabled. To enable, set e.g. /certs and mount your CAs there.
  CA_CERT_DIR: ${CA_CERT_DIR:-}
  # Dataset limits (spec §12.4). nginx accepts request bodies up to 50 MB.
  DATASET_MAX_UPLOAD_BYTES: ${DATASET_MAX_UPLOAD_BYTES:-26214400}
  DATASET_MAX_RECORDS: ${DATASET_MAX_RECORDS:-20000}
  DATASET_MAX_RECORD_BYTES: ${DATASET_MAX_RECORD_BYTES:-4194304}
  # Benchmark runs (spec §5.4, §8.2).
  RUN_MAX_REQUESTS: ${RUN_MAX_REQUESTS:-100000}
  RUN_MAX_CONCURRENCY: ${RUN_MAX_CONCURRENCY:-256}
  RUN_STORE_RESPONSES: ${RUN_STORE_RESPONSES:-true}
  RUN_RESPONSE_MAX_CHARS: ${RUN_RESPONSE_MAX_CHARS:-20000}
  REPORT_MAX_RESULTS: ${REPORT_MAX_RESULTS:-50000}
  # Authentication (see .env.example and docs/user-guide/authentication.md). deploy.sh generates
  # AUTH_SECRET_KEY and ADMIN_INITIAL_PASSWORD on first install.
  AUTH_ENABLED: ${AUTH_ENABLED:-true}
  AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
  AUTH_SESSION_IDLE_MINUTES: ${AUTH_SESSION_IDLE_MINUTES:-480}
  AUTH_SESSION_MAX_HOURS: ${AUTH_SESSION_MAX_HOURS:-72}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-auto}
  AUTH_LOCKOUT_THRESHOLD: ${AUTH_LOCKOUT_THRESHOLD:-5}
  AUTH_LOCKOUT_IP_THRESHOLD: ${AUTH_LOCKOUT_IP_THRESHOLD:-20}
  AUTH_LOCKOUT_SECONDS: ${AUTH_LOCKOUT_SECONDS:-900}
  AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-}
  # Integration-mode tool execution (Milestone 9; see docs/user-guide/tool-sandbox.md).
  TOOL_EXECUTION_ENABLED: ${TOOL_EXECUTION_ENABLED:-false}
  TOOL_RUNNER_URL: http://tool-runner:8100
  TOOL_RUNNER_TOKEN: ${TOOL_RUNNER_TOKEN:-}

x-backend: &backend
  build:
    context: ./backend
    args:
      WITH_KERBEROS: ${WITH_KERBEROS:-true}
  image: openllm-eval-backend:${OPENLLM_VERSION:-0.0.1}
  restart: unless-stopped
  environment: *backend-env
  # Model API keys: OPENLLM_SECRET_* variables, referenced by endpoints as "env:NAME".
  # Optional file (Compose >= 2.24); see secrets.env.example.
  env_file:
    - path: ./secrets.env
      required: false
  networks: [internal]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:16.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openllm_eval}
      POSTGRES_USER: ${POSTGRES_USER:-openllm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7.4.1-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      <<: *backend-env
      # Client addresses (audit log, sign-in lockout) come from the bundled proxy's
      # X-Forwarded-For header.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Model endpoints are usually on other hosts, so the API/worker need outbound access.
    # The tools network reaches the sandboxed tool runner (integration mode).
    networks: [internal, egress, tools]

  worker:
    <<: *backend
    command: ["python", "-m", "app.execution.worker"]
    # On stop/upgrade the worker hands its current run back to the queue (results so far are
    # kept, the next worker resumes it); give it time to do that before SIGKILL.
    stop_grace_period: 30s
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal, egress, tools]

  frontend:
    build:
      context: ./frontend
    image: openllm-eval-frontend:${OPENLLM_VERSION:-0.0.1}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal, egress]
    security_opt: ["no-new-privileges:true"]

  # Optional mock OpenAI-compatible model server for demos and smoke tests:
  #   docker compose --profile mock up -d
  # Register it as http://mock-llm:9000/v1 with model "mock-model" (allow the host with
  # ENDPOINT_ALLOWED_HOSTS=mock-llm or ENDPOINT_ALLOW_PRIVATE_NETWORKS=true).
  mock-llm:
    <<: *backend
    profiles: [mock]
    command: ["python", "-m", "app.testing.mock_openai", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      MOCK_MODELS: mock-model,mock-model-q4
    env_file: !reset []
    healthcheck:
      disable: true
    networks: [egress]

  # Executes administrator-declared tools for integration-mode runs (spec §5.7 mode C, §12.6).
  # Opt-in: bash scripts/deploy.sh --tools (with TOOL_EXECUTION_ENABLED=true in .env).
  # Deliberately not built from x-backend: it gets no secrets.env, no database or Redis access,
  # and sits only on the internal "tools" network (no internet). No Docker socket.
  tool-runner:
    build:
      context: ./backend
      args:
        WITH_KERBEROS: ${WITH_KERBEROS:-true}
    image: openllm-eval-backend:${OPENLLM_VERSION:-0.0.1}
    profiles: [tools]
    restart: unless-stopped
    command: ["python", "-m", "app.toolrunner.server", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      TOOL_RUNNER_TOKEN: ${TOOL_RUNNER_TOKEN:-}  # deploy.sh --tools generates it
      TOOLS_DIR: /tools
      TOOLS_FILE: ${TOOLS_FILE:-tools.yaml}
      TOOL_ALLOWED_HOSTS: ${TOOL_ALLOWED_HOSTS:-}
      TOOL_RUNNER_MAX_CONCURRENCY: ${TOOL_RUNNER_MAX_CONCURRENCY:-8}
      TOOL_SCRIPT_MEMORY_MB: ${TOOL_SCRIPT_MEMORY_MB:-256}
      ENDPOINT_BLOCKED_HOSTS: postgres,redis,api,worker,frontend,tool-runner
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - ./tools:/tools:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: ${TOOL_RUNNER_MEMORY:-1g}
    cpus: ${TOOL_RUNNER_CPUS:-1.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [tools]

networks:
  # Postgres and Redis live only on this network: no host ports and no outbound access.
  internal:
    internal: true
  egress: {}
  # The worker and API reach the tool runner here. No internet access. To let HTTP tools reach a
  # test service, attach that service (or the tool runner) to a network they share; see
  # docs/user-guide/tool-sandbox.md.
  tools:
    internal: true

volumes:
  postgres_data:
  redis_data:
