# Keep the original scheme when a TLS proxy sits in front of this container, so the API can mark
# the session cookie Secure.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Everything is served from this origin: no CDNs, remote fonts, or analytics.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 50m;

    # Look the API up through Docker's embedded DNS on each request (cached 10s). A literal host in
    # proxy_pass is resolved only once at startup, so a recreated api container (new IP) would
    # break /api until this container restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # $http_host keeps the port the browser used, so the API's same-origin check matches
        # the Origin header (e.g. http://server:3000).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Sign-in: API tokens and the Windows (Kerberos) Negotiate handshake.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        # Server-Sent Events (run progress, Milestone 3) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 1h;
        # Own headers here, so the server-level CSP above is not inherited: the API sets a strict CSP
        # on report downloads (inline styles, no scripts), and two CSPs would both be enforced.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
